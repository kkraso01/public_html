<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stationary Hover Test</title>
  <!--
    Entry assets:
    JS: https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
        drones/stationary/stationary_test.js
  -->
  <script>
    (() => {
      const stored = localStorage.getItem("theme");
      const theme = stored === "dark" || stored === "light" ? stored : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../../ui_theme.js"></script>
  <style>
    :root {
      --bg: #f6f6f6;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-elevated: rgba(255, 255, 255, 0.92);
      --text: #1a1a1a;
      --text-strong: #070707;
      --muted: #5a5a5a;
      --border: rgba(10, 10, 10, 0.14);
      --accent: #ff2d2d;
      --radius: 2px;
    }

    html[data-theme="dark"] {
      --bg: #060606;
      --surface: rgba(12, 12, 12, 0.9);
      --surface-elevated: rgba(18, 18, 18, 0.94);
      --text: #d6d6d6;
      --text-strong: #f5f5f5;
      --muted: #9a9a9a;
      --border: rgba(255, 255, 255, 0.14);
      --accent: #ff2d2d;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    #waypoint-input {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      min-width: 200px;
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    #waypoint-input h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-strong);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .input-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      width: 20px;
    }
    .input-group input {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      color: var(--text);
      font-size: 13px;
      font-family: 'Monaco', 'Courier New', monospace;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    #waypoint-input button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-strong);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    #waypoint-input button:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: none;
    }
    #waypoint-input button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="waypoint-input">
    <h3>Set Waypoint</h3>
    <div class="input-group">
      <label>X:</label>
      <input type="number" id="wp-x" step="0.1" value="0.0" />
    </div>
    <div class="input-group">
      <label>Y:</label>
      <input type="number" id="wp-y" step="0.1" value="0.0" />
    </div>
    <div class="input-group">
      <label>Z:</label>
      <input type="number" id="wp-z" step="0.1" value="0.6" />
    </div>
    <button id="set-waypoint-btn">Set Target</button>
    <button id="toggle-nose-btn" style="margin-top: 12px;">Nose-First: OFF</button>
  </div>
  <script type="module">
    import { initStationaryHoverDemo } from './stationary_test.js';

    function bootstrap() {
      const container = document.getElementById('app');
      initStationaryHoverDemo(container, { width: container.clientWidth, height: container.clientHeight });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
</html>
